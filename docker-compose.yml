services:
  proxy-bot:
    build: .
    container_name: proxy-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/shop.db
    extra_hosts:
      # чтобы бот мог дойти до прокси, запущенного на самом сервере
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
